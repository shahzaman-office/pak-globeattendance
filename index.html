
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pak Globe Travels — Transport Management</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .transport-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #ffffff;
    }
  </style>
</head>

<body>
  <iframe
    id="transportFrame"
    class="transport-frame"
    src="https://script.google.com/macros/s/AKfycbym5CwivTBdz8RTcFSXR-rf-1cKFxmQHQIVFnWR66DB98wILJqvldVLZvmfCCSYHc75/exec"
    title="Pak Globe Travels Transport Management System"
    allow="geolocation"
    allowfullscreen>
  </iframe>

  <script>
    (function () {
      "use strict";

      const iframe = document.getElementById("transportFrame");

      if (!iframe) {
        console.error("Transport iframe not found.");
        return;
      }

      window.addEventListener("load", function () {
        console.log("Pak Globe Travels Transport Management page loaded.");
      });

      iframe.addEventListener("load", function () {
        console.log("Transport iframe load event fired.");
      });

      iframe.addEventListener("error", function () {
        console.error("Unable to load the Transport Management System.");
      });
    })();
  </script>
</body>
</html>
