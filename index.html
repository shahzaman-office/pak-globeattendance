<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pak Globe Travels — Attendance</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    .attendance-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: #ffffff;
    }
  </style>
</head>

<body>

  <iframe
    id="attendanceFrame"
    class="attendance-frame"
    src="https://script.google.com/macros/s/AKfycbwtdD_BWxPeMGBGQ9DS-8uY-ApQrK5Yulv5hy082FGsSpiSEyrzv9xO7KClxAJGncbo/exec"
    title="Pak Globe Travels Attendance System"
    allow="geolocation"
    allowfullscreen>
  </iframe>

  <script>
    (function () {
      "use strict";

      const iframe = document.getElementById("attendanceFrame");

      if (!iframe) {
        console.error("Attendance iframe not found.");
        return;
      }

      window.addEventListener("load", function () {
        console.log("Pak Globe Travels Attendance System loaded.");
      });

      iframe.addEventListener("load", function () {
        console.log("Attendance system iframe loaded successfully.");
      });

      iframe.addEventListener("error", function () {
        console.error("Unable to load the attendance system.");
      });
    })();
  </script>

</body>
</html>
